name: Recover open LCA full texts from PDF reader

on:
  push:
    paths:
      - '.github/workflows/lca-open-reader-final.yml'

jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: python -m pip install --quiet requests
      - name: Fetch public full text
        shell: bash
        run: |
          python - <<'PY'
          import requests,json
          from pathlib import Path
          out=Path("out");out.mkdir(exist_ok=True)
          items={
            "W07":("https://onlinelibrary.wiley.com/doi/pdf/10.1111/gcbb.12387","Climate change mitigation potential of local use of harvest residues for bioenergy in Canada","CC BY 4.0"),
            "W41":("https://www.researchgate.net/publication/377530614_Soil_organic_carbon_change_can_reduce_the_climate_benefits_of_biofuel_produced_from_forest_residues","Soil organic carbon change can reduce the climate benefits of biofuel produced from forest residues","CC BY 4.0"),
            "W45":("https://onlinelibrary.wiley.com/doi/pdf/10.1111/gcbb.12276","Forest biomass energy: assessing atmospheric carbon impacts by discounting future carbon flows","CC BY 4.0"),
            "W52":("https://onlinelibrary.wiley.com/doi/pdf/10.1111/gcbb.70045","Assessing GHG Emissions Implications of Forest Residue Use for Energy Production","CC BY"),
            "W18":("https://ageconsearch.umn.edu/record/150293/files/Baker%20et%20al_AAEA%202013_A%20multi-sector%20intertemporal%20optimization%20approach%20to%20assess%20the%20GHG%20implications%20of%20U.S.%20forest%20and%20agricultural%20biomass%20electricity%20expansion.pdf","A multi-sector intertemporal optimization approach to assess the GHG implications of U.S. forest and agricultural biomass electricity expansion","public working paper")
          }
          s=requests.Session();s.headers.update({"User-Agent":"Mozilla/5.0"})
          rows=[]
          for rid,(src,title,license_) in items.items():
            u="https://r.jina.ai/"+src
            try:
              r=s.get(u,timeout=180)
              body=r.text
              print(rid,r.status_code,len(body),body[:100].replace("\n"," "),flush=True)
              key=title.lower().replace("–","-")[:28]
              norm=body.lower().replace("–","-")
              ok=r.status_code==200 and len(body)>5000 and key in norm
              if ok:
                header=f"# {title}\n\n**Corpus ID:** {rid}  \n**Source:** {src}  \n**License/access:** {license_}  \n**Archive note:** Searchable full-text rendering of the publicly accessible source for the private LCA App Project.\n\n---\n\n"
                p=out/f"{rid}_fulltext.md";p.write_text(header+body,encoding="utf-8")
                rows.append({"id":rid,"status":"RECOVERED","file":p.name,"bytes":p.stat().st_size})
              else:
                rows.append({"id":rid,"status":"FAILED","status_code":r.status_code,"bytes":len(body),"sample":body[:300]})
            except Exception as e:
              rows.append({"id":rid,"status":"FAILED","error":repr(e)})
          (out/"manifest.json").write_text(json.dumps(rows,indent=2),encoding="utf-8")
          print(json.dumps(rows,indent=2),flush=True)
          PY
      - name: Zip
        run: zip -9 -r open_reader_final.zip out
      - uses: actions/upload-artifact@v4
        with:
          name: LCA-Open-Reader-Final
          path: open_reader_final.zip
          retention-days: 7
