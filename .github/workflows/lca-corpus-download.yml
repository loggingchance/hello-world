name: Download LCA corpus PDFs second pass

on:
  push:
    paths:
      - '.github/workflows/lca-corpus-download.yml'

jobs:
  download:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PDF validator
        run: python -m pip install --quiet requests pypdf

      - name: Retrieve targeted public copies
        shell: bash
        run: |
          cat > /tmp/second_pass.py <<'PY'
          import csv, hashlib, json, re, time
          from pathlib import Path
          import requests
          from pypdf import PdfReader

          OUT=Path("second_pass")
          PDF=OUT/"reports"
          PDF.mkdir(parents=True,exist_ok=True)
          S=requests.Session()
          S.headers.update({
              "User-Agent":"Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/154 Safari/537.36",
              "Accept":"application/pdf,text/html,application/xhtml+xml,*/*;q=0.8",
              "Accept-Language":"en-US,en;q=0.9"
          })

          targets = {
            "W07":[
              ("https://onlinelibrary.wiley.com/doi/pdfdirect/10.1111/gcbb.12387",None),
              ("https://onlinelibrary.wiley.com/doi/epdf/10.1111/gcbb.12387",None),
            ],
            "W08":[
              ("https://onlinelibrary.wiley.com/doi/pdfdirect/10.1111/gcbb.12198",None),
              ("https://onlinelibrary.wiley.com/doi/epdf/10.1111/gcbb.12198",None),
            ],
            "W09":[
              ("https://onlinelibrary.wiley.com/doi/pdfdirect/10.1111/gcbb.12179",None),
              ("https://onlinelibrary.wiley.com/doi/epdf/10.1111/gcbb.12179",None),
            ],
            "W19":[
              ("https://research.fs.usda.gov/download/treesearch/42264.pdf",None),
            ],
            "W20":[
              ("https://europepmc.org/articles/PMC6145497?pdf=render",None),
              ("https://pmc.ncbi.nlm.nih.gov/articles/PMC6145497/bin/nihms982917.pdf",None),
              ("https://pmc.ncbi.nlm.nih.gov/articles/PMC6145497/pdf/nihms982917.pdf",None),
            ],
            "W22":[
              ("https://ageconsearch.umn.edu/record/50782/files/WorkingPaper2009-02.pdf",None),
              ("https://web.uvic.ca/~repa/publications/REPA%20working%20papers/WorkingPaper2009-02.pdf",None),
            ],
            "W25":[
              ("https://onlinelibrary.wiley.com/doi/pdfdirect/10.1111/gcbb.12327",None),
              ("https://onlinelibrary.wiley.com/doi/epdf/10.1111/gcbb.12327",None),
            ],
            "W29":[
              ("https://researchportal.bath.ac.uk/files/114850705/Adams_McManus_2014_Small_scale_biomass_gasification_CHP_energy_environmental_evaluation.pdf",
               "https://researchportal.bath.ac.uk/en/publications/small-scale-biomass-gasification-chp-utilisation-in-industry-ener/"),
            ],
            "W37":[
              ("https://research.fs.usda.gov/download/treesearch/35180.pdf",None),
            ],
            "W39":[
              ("https://onlinelibrary.wiley.com/doi/pdfdirect/10.1111/gcbb.13048",None),
              ("https://onlinelibrary.wiley.com/doi/epdf/10.1111/gcbb.13048",None),
            ],
            "W41":[
              ("https://www.sciencedirect.com/science/article/pii/S2542435123005378/pdfft?isDTMRedir=true&download=true",
               "https://www.sciencedirect.com/science/article/pii/S2542435123005378"),
            ],
            "W43":[
              ("https://europepmc.org/articles/PMC7065381?pdf=render",None),
              ("https://pmc.ncbi.nlm.nih.gov/articles/PMC7065381/bin/nihms1561041.pdf",None),
              ("https://pmc.ncbi.nlm.nih.gov/articles/PMC7065381/pdf/nihms1561041.pdf",None),
            ],
            "W45":[
              ("https://onlinelibrary.wiley.com/doi/pdfdirect/10.1111/gcbb.12276",None),
              ("https://onlinelibrary.wiley.com/doi/epdf/10.1111/gcbb.12276",None),
            ],
            "W46":[
              ("https://legislature.vermont.gov/Documents/2024/WorkGroups/Senate%20Natural%20Resources/Bills/S.5/Witness%20Documents/S.5~Laura%20Haight~GCB%20Bioenergy%202015~2-8-2023.pdf",None),
              ("https://repository.usfca.edu/cgi/viewcontent.cgi?article=1014&context=envs",
               "https://repository.usfca.edu/envs/15/"),
              ("https://onlinelibrary.wiley.com/doi/pdfdirect/10.1111/gcbb.12245",None),
            ],
            "W50":[
              ("https://publications.jrc.ec.europa.eu/repository/bitstream/JRC70663/eur25354en_online.pdf",None),
              ("https://publications.jrc.ec.europa.eu/repository/bitstream/JRC70663/eur%2025354%20en%20online.pdf",None),
            ],
            "W52":[
              ("https://onlinelibrary.wiley.com/doi/pdfdirect/10.1111/gcbb.70045",None),
              ("https://onlinelibrary.wiley.com/doi/epdf/10.1111/gcbb.70045",None),
            ],
            "W61":[
              ("https://docs.cpuc.ca.gov/PublishedDocs/Efile/G000/M512/K176/512176981.PDF",None),
            ],
            "N01":[
              ("https://www.energy.gov/sites/default/files/2025-01/generic-counterfactual-greenhouse-gas-emission-factor-for-life-cycle-assessment-of-manure-derived-biogas-and-renewable-natural-gas_010225.pdf",None),
            ]
          }

          def download(rid,url,referer=None):
              headers={}
              if referer: headers["Referer"]=referer
              try:
                  r=S.get(url,headers=headers,timeout=90,allow_redirects=True)
                  ct=(r.headers.get("content-type") or "").lower()
                  if r.status_code!=200:
                      return None,f"HTTP {r.status_code} {r.url}"
                  b=r.content
                  if not (b.startswith(b"%PDF-") or "application/pdf" in ct):
                      return None,f"not-pdf {ct} {r.url}"
                  if len(b)<5000:
                      return None,f"too-small {len(b)} {r.url}"
                  path=PDF/f"{rid}.pdf"
                  path.write_bytes(b)
                  try:
                      pr=PdfReader(str(path),strict=False)
                      pages=len(pr.pages)
                      if pages<1: raise ValueError("zero pages")
                  except Exception as e:
                      path.unlink(missing_ok=True)
                      return None,f"invalid-pdf {e}"
                  return {
                      "id":rid,"status":"DOWNLOADED","source_url":r.url,
                      "bytes":len(b),"pages":pages,
                      "sha256":hashlib.sha256(b).hexdigest()
                  },None
              except Exception as e:
                  return None,f"{type(e).__name__}: {e}"

          manifest=[]
          for rid,urls in targets.items():
              errors=[]
              got=None
              for url,ref in urls:
                  print(rid,url,flush=True)
                  got,err=download(rid,url,ref)
                  if got: break
                  errors.append(err)
                  time.sleep(.2)
              if got:
                  manifest.append(got)
                  print(" SUCCESS",got["pages"],got["source_url"],flush=True)
              else:
                  manifest.append({"id":rid,"status":"FAILED","errors":" | ".join(errors)})
                  print(" FAILED",errors,flush=True)

          fields=["id","status","pages","bytes","sha256","source_url","errors"]
          with open(OUT/"manifest.csv","w",newline="",encoding="utf-8") as f:
              w=csv.DictWriter(f,fieldnames=fields,extrasaction="ignore")
              w.writeheader(); w.writerows(manifest)
          (OUT/"manifest.json").write_text(json.dumps(manifest,indent=2),encoding="utf-8")
          print("DOWNLOADED",sum(x["status"]=="DOWNLOADED" for x in manifest))
          PY
          python /tmp/second_pass.py

      - name: Package second pass
        run: |
          cd second_pass
          zip -9 -r ../LCA_Corpus_Second_Pass.zip reports manifest.csv manifest.json

      - uses: actions/upload-artifact@v4
        with:
          name: LCA-Corpus-Second-Pass
          path: LCA_Corpus_Second_Pass.zip
          retention-days: 7
          if-no-files-found: error
