name: Recover embedded and repository LCA PDFs

on:
  push:
    paths:
      - '.github/workflows/lca-corpus-download.yml'

jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PDF tools
        run: python -m pip install --quiet pypdf requests

      - name: Recover articles
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p recovered/reports
          python - <<'PY'
          import hashlib, json, requests
          from pathlib import Path
          from pypdf import PdfReader, PdfWriter

          out=Path("recovered/reports")
          s=requests.Session()
          s.headers.update({"User-Agent":"Mozilla/5.0","Accept":"application/pdf,*/*;q=0.8"})
          manifest=[]

          def save_direct(rid,url):
              try:
                  r=s.get(url,timeout=120,allow_redirects=True)
                  b=r.content
                  if r.status_code==200 and b.startswith(b"%PDF-") and len(b)>5000:
                      p=out/f"{rid}.pdf"; p.write_bytes(b)
                      pages=len(PdfReader(str(p),strict=False).pages)
                      manifest.append({"id":rid,"status":"DOWNLOADED","source_url":r.url,"pages":pages,
                                       "sha256":hashlib.sha256(b).hexdigest(),"method":"institutional repository"})
                      print("DIRECT",rid,pages,r.url)
                      return True
                  print("DIRECT FAIL",rid,r.status_code,r.url,r.headers.get("content-type"))
              except Exception as e:
                  print("DIRECT ERR",rid,e)
              return False

          # Cleaner institutional repository endpoint for Adams & McManus.
          save_direct("W29","https://purehost.bath.ac.uk/ws/files/114850705/Adams_McManus_2014_Small_scale_biomass_gasification_CHP_energy_environmental_evaluation.pdf")

          # Public rulemaking/comment attachment containing complete copies of cited studies.
          nrdc_url="https://www.nrdc.org/sites/default/files/joint-engo-ace-biomass-comments-20181031.pdf"
          r=s.get(nrdc_url,timeout=180,allow_redirects=True)
          if not (r.status_code==200 and r.content.startswith(b"%PDF-")):
              raise RuntimeError(f"NRDC source failed: {r.status_code} {r.url} {r.headers.get('content-type')}")
          src=Path("recovered/nrdc_comments.pdf"); src.write_bytes(r.content)
          reader=PdfReader(str(src),strict=False)
          print("NRDC pages",len(reader.pages))

          # 1-based page ranges in the public attachment. Each range is the complete article.
          ranges={
              "W25":(83,94),   # Laganière et al., GCB Bioenergy 9:358-369
              "W06":(96,102),  # McKechnie et al., ES&T 45:789-795
              "W09":(115,125), # Repo et al., GCB Bioenergy 7:877-887
              "W08":(134,146), # Ter-Mikaelian et al., GCB Bioenergy 7:704-716
          }
          for rid,(p1,p2) in ranges.items():
              w=PdfWriter()
              for n in range(p1-1,p2):
                  w.add_page(reader.pages[n])
              path=out/f"{rid}.pdf"
              with path.open("wb") as fh: w.write(fh)
              check=PdfReader(str(path),strict=False)
              b=path.read_bytes()
              manifest.append({"id":rid,"status":"DOWNLOADED","source_url":nrdc_url,
                               "pages":len(check.pages),"sha256":hashlib.sha256(b).hexdigest(),
                               "method":f"extracted complete article from public regulatory-comment attachment, source pages {p1}-{p2}"})
              print("EXTRACT",rid,len(check.pages))

          Path("recovered/manifest.json").write_text(json.dumps(manifest,indent=2),encoding="utf-8")
          import csv
          with open("recovered/manifest.csv","w",newline="",encoding="utf-8") as fh:
              w=csv.DictWriter(fh,fieldnames=["id","status","method","source_url","pages","sha256"])
              w.writeheader(); w.writerows(manifest)
          PY

      - name: Package
        run: |
          cd recovered
          zip -9 -r ../LCA_Corpus_Recovered.zip reports manifest.csv manifest.json

      - uses: actions/upload-artifact@v4
        with:
          name: LCA-Corpus-Recovered
          path: LCA_Corpus_Recovered.zip
          retention-days: 7
          if-no-files-found: error
