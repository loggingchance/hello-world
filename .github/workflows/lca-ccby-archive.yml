name: Archive CC BY LCA full texts

on:
  push:
    paths:
      - '.github/workflows/lca-ccby-archive.yml'

jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install HTTP client
        run: python -m pip install --quiet requests
      - name: Fetch reader copies
        shell: bash
        run: |
          python - <<'PY'
          import requests, json
          from pathlib import Path
          out=Path("out"); out.mkdir(exist_ok=True)
          items={
            "W07":("https://onlinelibrary.wiley.com/doi/full/10.1111/gcbb.12387","Climate change mitigation potential of local use of harvest residues for bioenergy in Canada","10.1111/gcbb.12387"),
            "W39":("https://onlinelibrary.wiley.com/doi/full/10.1111/gcbb.13048","Diverting residual biomass to energy use: Quantifying the global warming potential of biogenic CO2","10.1111/gcbb.13048"),
            "W41":("https://www.sciencedirect.com/science/article/pii/S2542435123005378","Soil organic carbon change can reduce the climate benefits of biofuel produced from forest residues","10.1016/j.joule.2023.12.018"),
            "W45":("https://onlinelibrary.wiley.com/doi/full/10.1111/gcbb.12276","Forest biomass energy: assessing atmospheric carbon impacts by discounting future carbon flows","10.1111/gcbb.12276"),
            "W52":("https://onlinelibrary.wiley.com/doi/full/10.1111/gcbb.70045","Assessing GHG Emissions Implications of Forest Residue Use for Energy Production","10.1111/gcbb.70045"),
          }
          s=requests.Session()
          s.headers.update({"User-Agent":"Mozilla/5.0"})
          rows=[]
          for id,(src,title,doi) in items.items():
            u="https://r.jina.ai/"+src
            try:
              r=s.get(u,timeout=120)
              body=r.text
              needle=title.lower().split(":")[0][:35]
              ok=r.status_code==200 and len(body)>10000 and needle in body.lower()
              print(id,r.status_code,len(body),ok,flush=True)
              if not ok:
                rows.append({"id":id,"status":"FAILED","bytes":len(body),"sample":body[:250]})
                continue
              header="\n".join([
                "# "+title,
                "",
                "**Corpus ID:** "+id+"  ",
                "**DOI:** https://doi.org/"+doi+"  ",
                "**Original publisher page:** "+src+"  ",
                "**License:** Creative Commons Attribution 4.0 (CC BY 4.0), as stated by the publisher/author full-text record.  ",
                "**Archive note:** Searchable text/Markdown archival rendering of the openly licensed article for the private LCA App Project. It is not the publisher-layout PDF.",
                "",
                "---",
                "",
              ])
              p=out/(id+"_fulltext_CC-BY.md")
              p.write_text(header+body,encoding="utf-8")
              rows.append({"id":id,"status":"RECOVERED_FULLTEXT","file":p.name,"bytes":p.stat().st_size})
            except Exception as e:
              rows.append({"id":id,"status":"FAILED","error":repr(e)})
          (out/"manifest.json").write_text(json.dumps(rows,indent=2),encoding="utf-8")
          print(json.dumps(rows,indent=2),flush=True)
          PY
      - name: Zip
        run: zip -9 -r ccby_archive.zip out
      - uses: actions/upload-artifact@v4
        with:
          name: LCA-CCBY-Archive
          path: ccby_archive.zip
          retention-days: 7
