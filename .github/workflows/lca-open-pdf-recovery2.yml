name: LCA open PDF recovery 2

on:
  push:
    paths:
      - '.github/workflows/lca-open-pdf-recovery2.yml'

jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: python -m pip install --quiet requests pypdf beautifulsoup4
      - name: Fetch public PDFs
        shell: bash
        run: |
          python - <<'PY'
          import json, re, time, hashlib
          from pathlib import Path
          import requests
          from pypdf import PdfReader

          out=Path("out")
          out.mkdir(exist_ok=True)
          ua="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/154 Safari/537.36"
          expected={
            "W07":["climate change mitigation potential","harvest residues"],
            "W18":["multi-sector intertemporal optimization","biomass electricity"],
            "W31":["life cycle assessment of co-firing","wood pellets"],
            "W39":["diverting residual biomass","biogenic"],
            "W41":["soil organic carbon change","forest residues"],
            "W45":["forest biomass energy","discounting future carbon flows"],
            "W52":["assessing ghg emissions implications","forest residue"],
          }
          rows=[]

          def save(id,b,url,method):
              if len(b)<5000 or not b.startswith(b"%PDF-"):
                  return None
              p=out/f"{id}.pdf"
              p.write_bytes(b)
              try:
                  r=PdfReader(str(p),strict=False)
                  pages=len(r.pages)
                  txt="\n".join((pg.extract_text() or "") for pg in r.pages[:min(12,pages)]).lower()
                  if not all(t in txt for t in expected[id]):
                      p.unlink(missing_ok=True)
                      return None
              except Exception:
                  p.unlink(missing_ok=True)
                  return None
              return {"id":id,"status":"RECOVERED","pages":pages,"bytes":len(b),"url":url,"method":method,
                      "sha256":hashlib.sha256(b).hexdigest()}

          def new_session():
              s=requests.Session()
              s.headers.update({"User-Agent":ua,"Accept-Language":"en-US,en;q=0.9"})
              return s

          def wiley(id,doi):
              s=new_session()
              page=f"https://onlinelibrary.wiley.com/doi/full/{doi}"
              pdf=f"https://onlinelibrary.wiley.com/doi/pdf/{doi}"
              try:
                  a=s.get(page,timeout=60,allow_redirects=True,headers={"Accept":"text/html,*/*;q=0.8"})
                  print(id,"warm",a.status_code,a.url,len(a.content),flush=True)
                  h={"Referer":a.url,"Accept":"application/pdf,application/octet-stream,*/*;q=0.5"}
                  b=s.get(pdf,timeout=120,allow_redirects=True,headers=h)
                  print(id,"pdf",b.status_code,b.url,b.headers.get("content-type"),len(b.content),b.content[:5],flush=True)
                  return save(id,b.content,b.url,"Wiley public/open PDF")
              except Exception as e:
                  print(id,"ERR",repr(e),flush=True)
                  return None

          for id,doi in [("W07","10.1111/gcbb.12387"),("W39","10.1111/gcbb.13048"),("W45","10.1111/gcbb.12276"),("W52","10.1111/gcbb.70045")]:
              got=wiley(id,doi)
              rows.append(got or {"id":id,"status":"FAILED"})

          # W18 public AAEA/AgEcon paper.
          s=new_session()
          rec="https://ageconsearch.umn.edu/record/150293"
          raw="https://ageconsearch.umn.edu/record/150293/files/Baker%20et%20al_AAEA%202013_A%20multi-sector%20intertemporal%20optimization%20approach%20to%20assess%20the%20GHG%20implications%20of%20U.S.%20forest%20and%20agricultural%20biomass%20electricity%20expansion.pdf"
          try:
              a=s.get(rec,timeout=60,allow_redirects=True)
              print("W18 warm",a.status_code,a.url,len(a.content),flush=True)
              for u in [raw,raw+"?download=1","https://purl.umn.edu/150293"]:
                  b=s.get(u,timeout=120,allow_redirects=True,headers={"Referer":a.url,"Accept":"application/pdf,*/*;q=0.8"})
                  print("W18 try",b.status_code,b.url,b.headers.get("content-type"),len(b.content),b.content[:5],flush=True)
                  got=save("W18",b.content,b.url,"AAEA/AgEcon public working paper")
                  if got: break
              else: got=None
              rows.append(got or {"id":"W18","status":"FAILED"})
          except Exception as e:
              print("W18 ERR",repr(e),flush=True); rows.append({"id":"W18","status":"FAILED","error":repr(e)})

          # W41 Cell/Joule open access
          s=new_session()
          page="https://www.cell.com/joule/fulltext/S2542-4351(23)00537-8"
          pdf="https://www.cell.com/action/showPdf?pii=S2542-4351%2823%2900537-8"
          try:
              a=s.get(page,timeout=60,allow_redirects=True)
              b=s.get(pdf,timeout=120,allow_redirects=True,headers={"Referer":a.url,"Accept":"application/pdf,*/*;q=0.8"})
              print("W41",a.status_code,b.status_code,b.url,b.headers.get("content-type"),len(b.content),b.content[:5],flush=True)
              got=save("W41",b.content,b.url,"Cell/Joule open-access PDF")
              rows.append(got or {"id":"W41","status":"FAILED"})
          except Exception as e:
              print("W41 ERR",repr(e),flush=True); rows.append({"id":"W41","status":"FAILED","error":repr(e)})

          # W31 Elsevier open manuscript
          s=new_session()
          page="https://www.sciencedirect.com/science/article/pii/S0959652617304614"
          try:
              a=s.get(page,timeout=60,allow_redirects=True)
              print("W31 warm",a.status_code,a.url,len(a.content),flush=True)
              urls=[
                "https://www.sciencedirect.com/science/article/am/pii/S0959652617304614",
                "https://www.sciencedirect.com/science/article/pii/S0959652617304614/pdfft?isDTMRedir=true&download=true"
              ]
              got=None
              for u in urls:
                  b=s.get(u,timeout=120,allow_redirects=True,headers={"Referer":a.url,"Accept":"application/pdf,*/*;q=0.8"})
                  print("W31 try",b.status_code,b.url,b.headers.get("content-type"),len(b.content),b.content[:5],flush=True)
                  got=save("W31",b.content,b.url,"ScienceDirect open manuscript")
                  if got: break
              rows.append(got or {"id":"W31","status":"FAILED"})
          except Exception as e:
              print("W31 ERR",repr(e),flush=True); rows.append({"id":"W31","status":"FAILED","error":repr(e)})

          Path("out/manifest.json").write_text(json.dumps(rows,indent=2),encoding="utf-8")
          print(json.dumps(rows,indent=2),flush=True)
          PY
      - name: Zip
        run: zip -9 -r recovery2.zip out
      - uses: actions/upload-artifact@v4
        with:
          name: LCA-Open-Recovery-2
          path: recovery2.zip
          retention-days: 7
