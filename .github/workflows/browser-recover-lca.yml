name: Browser recover missing LCA PDFs

on:
  push:
    paths:
      - '.github/workflows/browser-recover-lca.yml'

jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - name: Install PDF validation tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils >/dev/null
      - name: Recover via browser
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out raw
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser)"
          echo "Chrome: $CHROME"
          browser_pdf () {
            id="$1"; url="$2"; needle="$3"
            rm -f "raw/$id.pdf"
            echo "TRY $id $url"
            timeout 150 "$CHROME" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage \
              --run-all-compositor-stages-before-draw --virtual-time-budget=15000 \
              --print-to-pdf-no-header --print-to-pdf="raw/$id.pdf" "$url" >/tmp/"$id".log 2>&1 || true
            if [ ! -s "raw/$id.pdf" ]; then echo "NOFILE $id"; return 1; fi
            pages=$(pdfinfo "raw/$id.pdf" 2>/dev/null | awk '/^Pages:/ {print $2}')
            pdftotext "raw/$id.pdf" "raw/$id.txt" 2>/dev/null || true
            bytes=$(stat -c%s "raw/$id.pdf")
            echo "$id pages=$pages bytes=$bytes"
            if [ -z "$pages" ] || [ "$pages" -lt 2 ]; then echo "TOO_SHORT $id"; return 1; fi
            if ! grep -Fqi "$needle" "raw/$id.txt"; then
              echo "TITLE_MISS $id"; head -50 "raw/$id.txt" || true; return 1
            fi
            mv "raw/$id.pdf" "out/$id.pdf"
            echo "SUCCESS $id $pages"
          }

          # Direct public PDF endpoints rendered by a real browser (avoids bot blocks).
          browser_pdf W20 'https://pmc.ncbi.nlm.nih.gov/articles/PMC6145497/pdf/nihms982917.pdf' 'Cumulative global forest carbon implications' || true
          browser_pdf W43 'https://pmc.ncbi.nlm.nih.gov/articles/PMC7065381/pdf/nihms1561041.pdf' 'Potential complementarity between forest carbon' || true
          browser_pdf W07 'https://onlinelibrary.wiley.com/doi/pdfdirect/10.1111/gcbb.12387' 'Climate change mitigation potential of local use' || true
          browser_pdf W39 'https://onlinelibrary.wiley.com/doi/pdfdirect/10.1111/gcbb.13048' 'Diverting residual biomass to energy use' || true
          browser_pdf W45 'https://onlinelibrary.wiley.com/doi/pdfdirect/10.1111/gcbb.12276' 'Forest biomass energy' || true
          browser_pdf W52 'https://onlinelibrary.wiley.com/doi/pdfdirect/10.1111/gcbb.70045' 'Assessing GHG emissions implications' || true
          browser_pdf W41 'https://www.sciencedirect.com/science/article/pii/S2542435123005378/pdfft?isDTMRedir=true&download=true' 'Soil organic carbon change can reduce' || true
          browser_pdf W18 'https://ageconsearch.umn.edu/record/150293/files/Baker%20et%20al_AAEA%202013_A%20multi-sector%20intertemporal%20optimization%20approach%20to%20assess%20the%20GHG%20implications%20of%20U.S.%20forest%20and%20agricultural%20biomass%20electricity%20expansion.pdf' 'multi-sector intertemporal optimization' || true
          browser_pdf W40 'https://www.academia.edu/attachments/53330556/download_file?s=profile' 'Scenario uncertainties in estimating direct land-use' || true

          # If original PDF endpoint resists, print the public full-text article page for OA/PMC sources.
          browser_page () {
            id="$1"; url="$2"; needle="$3"
            [ -f "out/$id.pdf" ] && return 0
            echo "PAGE TRY $id $url"
            timeout 150 "$CHROME" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage \
              --run-all-compositor-stages-before-draw --virtual-time-budget=20000 \
              --print-to-pdf-no-header --print-to-pdf="raw/$id-page.pdf" "$url" >/tmp/"$id"-page.log 2>&1 || true
            [ -s "raw/$id-page.pdf" ] || return 1
            pdftotext "raw/$id-page.pdf" "raw/$id-page.txt" 2>/dev/null || true
            pages=$(pdfinfo "raw/$id-page.pdf" 2>/dev/null | awk '/^Pages:/ {print $2}')
            if [ "$pages" -ge 4 ] && grep -Fqi "$needle" "raw/$id-page.txt"; then
              mv "raw/$id-page.pdf" "out/$id.pdf"
              echo "PAGE SUCCESS $id $pages"
            fi
          }
          browser_page W20 'https://pmc.ncbi.nlm.nih.gov/articles/PMC6145497/' 'Cumulative global forest carbon implications' || true
          browser_page W43 'https://pmc.ncbi.nlm.nih.gov/articles/PMC7065381/' 'Potential complementarity between forest carbon' || true
          browser_page W07 'https://onlinelibrary.wiley.com/doi/full/10.1111/gcbb.12387' 'Climate change mitigation potential of local use' || true
          browser_page W39 'https://onlinelibrary.wiley.com/doi/full/10.1111/gcbb.13048' 'Diverting residual biomass to energy use' || true
          browser_page W45 'https://onlinelibrary.wiley.com/doi/full/10.1111/gcbb.12276' 'Forest Biomass Energy' || true
          browser_page W52 'https://onlinelibrary.wiley.com/doi/full/10.1111/gcbb.70045' 'Assessing GHG Emissions Implications' || true
          browser_page W41 'https://www.sciencedirect.com/science/article/pii/S2542435123005378' 'Soil organic carbon change can reduce' || true

          rm -f raw/*.txt
          echo "Recovered:"
          for p in out/*.pdf; do
            [ -e "$p" ] || continue
            echo "$(basename "$p") $(pdfinfo "$p" | awk '/^Pages:/ {print $2}') pages $(stat -c%s "$p") bytes"
          done
          printf '%s\n' \
            'Browser recovery. Each PDF was validated by page count and title text.' \
            'Files produced from an original PDF endpoint are source PDFs rendered by Chrome.' \
            'Fallback page prints are used only for publicly available PMC/open-access full-text pages.' \
            > out/manifest.txt
      - name: Zip
        run: zip -9 -r browser_recovery.zip out
      - uses: actions/upload-artifact@v4
        with:
          name: Browser-Recovered-LCA
          path: browser_recovery.zip
          retention-days: 7
