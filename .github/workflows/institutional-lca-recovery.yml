name: Institutional LCA recovery simple

on:
  push:
    paths:
      - '.github/workflows/institutional-lca-recovery.yml'

jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - name: Install
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils >/dev/null
      - name: Download and extract
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out src
          UA='Mozilla/5.0'
          getpdf() {
            dest="$1"; shift
            for url in "$@"; do
              echo "GET $url"
              curl -L --fail --retry 3 --retry-delay 2 --connect-timeout 30 --max-time 240 -A "$UA" -o "$dest.tmp" "$url" || true
              if [ -s "$dest.tmp" ] && head -c 5 "$dest.tmp" | grep -q '%PDF-'; then mv "$dest.tmp" "$dest"; return 0; fi
              rm -f "$dest.tmp"
            done
            return 1
          }

          getpdf src/W28_thesis.pdf 'https://tesisenred.net/bitstream/handle/10803/48708/npm1de1.pdf?isAllowed=y&sequence=1' 'https://www.tdx.cat/bitstream/handle/10803/48708/npm1de1.pdf?sequence=1&isAllowed=y' || true
          getpdf src/W38_thesis.pdf 'https://lutpub.lut.fi/bitstream/handle/10024/92496/isbn9789522654496.pdf?sequence=2&isAllowed=y' 'https://lutpub.lut.fi/bitstream/handle/10024/92496/isbn9789522654496.pdf?sequence=1&isAllowed=y' || true
          getpdf src/W40.pdf 'https://www.academia.edu/attachments/53330556/download_file?s=profile' || true

          extract_by_title() {
            infile="$1"; outfile="$2"; title="$3"; nextpat="$4"; maxpages="$5"
            [ -f "$infile" ] || return 0
            n=$(pdfinfo "$infile" | awk '/^Pages:/ {print $2}')
            start=''
            for i in $(seq 1 "$n"); do
              if pdftotext -f "$i" -l "$i" "$infile" - 2>/dev/null | tr '\n' ' ' | grep -Fqi "$title"; then start="$i"; fi
            done
            echo "$outfile start=$start total=$n"
            [ -n "$start" ] || return 0
            end=$((start+maxpages-1)); [ "$end" -gt "$n" ] && end="$n"
            for j in $(seq $((start+2)) "$end"); do
              if pdftotext -f "$j" -l "$j" "$infile" - 2>/dev/null | tr '\n' ' ' | grep -Eqi "$nextpat"; then end=$((j-1)); break; fi
            done
            mkdir -p split
            rm -f split/*.pdf
            pdfseparate -f "$start" -l "$end" "$infile" 'split/page-%d.pdf'
            pdfunite $(find split -name 'page-*.pdf' | sort -V) "$outfile"
            echo "EXTRACTED $outfile pages $(pdfinfo "$outfile" | awk '/^Pages:/ {print $2}')"
          }

          extract_by_title src/W28_thesis.pdf out/W28.pdf 'Environmental assessment of post-consumer wood and forest residues' 'CHAPTER[[:space:]]+IV|Chapter[[:space:]]+IV' 35
          extract_by_title src/W38_thesis.pdf out/W38.pdf 'Greenhouse gas emissions of forest bioenergy supply and utilization in Finland' 'PUBLICATION|ARTICLE[[:space:]]+[IVX]|CHAPTER[[:space:]]+[IVX]' 30

          if [ -f src/W40.pdf ]; then
            if pdftotext -f 1 -l 3 src/W40.pdf - 2>/dev/null | grep -Fqi 'Scenario uncertainties in estimating direct land-use change'; then cp src/W40.pdf out/W40.pdf; fi
          fi

          for f in out/*.pdf; do [ -e "$f" ] || continue; echo "$(basename "$f") $(pdfinfo "$f" | awk '/^Pages:/ {print $2}') pages $(stat -c%s "$f") bytes"; done
          printf 'Institutional repository recovery.\n' > out/README.txt
      - name: Package
        run: zip -9 -r institutional_recovery.zip out
      - uses: actions/upload-artifact@v4
        with:
          name: Institutional-LCA-Recovery
          path: institutional_recovery.zip
          retention-days: 7
