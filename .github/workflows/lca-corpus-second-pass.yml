name: LCA corpus second pass

on:
  push:
    paths:
      - '.github/workflows/lca-corpus-second-pass.yml'

jobs:
  download:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --quiet requests beautifulsoup4 pypdf
      - name: Retrieve curated open copies
        shell: bash
        run: |
          cat > /tmp/second.py <<'PY'
          import os,re,json,hashlib,time
          from pathlib import Path
          from urllib.parse import urljoin
          import requests
          from bs4 import BeautifulSoup
          from pypdf import PdfReader

          OUT=Path("second_pass")
          R=OUT/"reports"
          R.mkdir(parents=True, exist_ok=True)
          S=requests.Session()
          S.headers.update({"User-Agent":"Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/130 Safari/537.36",
                            "Accept":"text/html,application/pdf,*/*;q=0.8"})

          URLS={
            "W07":[
              "https://onlinelibrary.wiley.com/doi/pdfdirect/10.1111/gcbb.12387",
              "https://onlinelibrary.wiley.com/doi/epdf/10.1111/gcbb.12387",
              "https://onlinelibrary.wiley.com/doi/pdf/10.1111/gcbb.12387"
            ],
            "W09":[
              "https://onlinelibrary.wiley.com/doi/pdfdirect/10.1111/gcbb.12179",
              "https://onlinelibrary.wiley.com/doi/epdf/10.1111/gcbb.12179"
            ],
            "W18":[
              "https://ageconsearch.umn.edu/record/150293/files/Baker%20et%20al_AAEA%202013_A%20multi-sector%20intertemporal%20optimization%20approach%20to%20assess%20the%20GHG%20implications%20of%20U.S.%20forest%20and%20agricultural%20biomass%20electricity%20expansion.pdf",
              "https://ageconsearch.umn.edu/record/150293"
            ],
            "W22":[
              "https://web.uvic.ca/~repa/publications/REPA%20working%20papers/WorkingPaper2009-02.pdf",
              "https://ageconsearch.umn.edu/record/50782"
            ],
            "W25":[
              "https://onlinelibrary.wiley.com/doi/pdfdirect/10.1111/gcbb.12327",
              "https://onlinelibrary.wiley.com/doi/epdf/10.1111/gcbb.12327"
            ],
            "W29":[
              "https://purehost.bath.ac.uk/ws/files/114850705/Adams_McManus_2014_Small_scale_biomass_gasification_CHP_energy_environmental_evaluation.pdf"
            ],
            "W31":[
              "https://www.sciencedirect.com/science/article/am/pii/S0959652617304614"
            ],
            "W33":[
              "https://www.sciencedirect.com/science/article/am/pii/S0301421519300060"
            ],
            "W39":[
              "https://onlinelibrary.wiley.com/doi/pdfdirect/10.1111/gcbb.13048",
              "https://onlinelibrary.wiley.com/doi/epdf/10.1111/gcbb.13048"
            ],
            "W41":[
              "https://www.cell.com/action/showPdf?pii=S2542-4351%2823%2900537-8",
              "https://www.sciencedirect.com/science/article/pii/S2542435123005378/pdfft"
            ],
            "W43":[
              "https://pmc.ncbi.nlm.nih.gov/articles/PMC7065381/",
              "https://pmc.ncbi.nlm.nih.gov/articles/PMC7065381/pdf/"
            ],
            "W45":[
              "https://onlinelibrary.wiley.com/doi/pdfdirect/10.1111/gcbb.12276",
              "https://onlinelibrary.wiley.com/doi/epdf/10.1111/gcbb.12276"
            ],
            "W46":[
              "https://legislature.vermont.gov/Documents/2024/WorkGroups/Senate%20Natural%20Resources/Bills/S.5/Witness%20Documents/S.5~Laura%20Haight~GCB%20Bioenergy%202015~2-8-2023.pdf",
              "https://repository.usfca.edu/cgi/viewcontent.cgi?article=1014&context=envs",
              "https://onlinelibrary.wiley.com/doi/pdfdirect/10.1111/gcbb.12245"
            ],
            "W50":[
              "https://publications.jrc.ec.europa.eu/repository/bitstream/JRC70663/eur25354en_online.pdf",
              "https://publications.jrc.ec.europa.eu/repository/handle/JRC70663"
            ],
            "W52":[
              "https://onlinelibrary.wiley.com/doi/pdfdirect/10.1111/gcbb.70045",
              "https://onlinelibrary.wiley.com/doi/epdf/10.1111/gcbb.70045"
            ],
            "W53":[
              "https://www.rff.org/documents/4574/Report_24-14.pdf",
              "https://media.rff.org/documents/Report_24-14.pdf"
            ],
            "W61a":[
              "https://nepis.epa.gov/Exe/ZyPDF.cgi?Dockey=P100RNZG.PDF"
            ],
            "N01":[
              "https://www.energy.gov/sites/default/files/2025-01/generic-counterfactual-greenhouse-gas-emission-factor-for-life-cycle-assessment-of-manure-derived-biogas-and-renewable-natural-gas_010225.pdf"
            ]
          }

          def valid_pdf(b):
              return len(b)>4000 and b[:5]==b"%PDF-"

          def save(id,b,url,kind="exact_or_open_version"):
              p=R/(id+".pdf")
              p.write_bytes(b)
              try:
                  pages=len(PdfReader(str(p),strict=False).pages)
              except Exception as e:
                  p.unlink(missing_ok=True); return None
              return {"id":id,"status":"DOWNLOADED","file":p.name,"pages":pages,"bytes":len(b),
                      "sha256":hashlib.sha256(b).hexdigest(),"url":url,"version_kind":kind}

          def get(u,timeout=90):
              try:
                  r=S.get(u,timeout=timeout,allow_redirects=True)
                  return r
              except Exception as e:
                  return None

          def html_pdf_links(resp):
              out=[]
              try:
                  soup=BeautifulSoup(resp.text,"html.parser")
              except Exception:
                  return out
              # citation/meta
              for meta in soup.find_all("meta"):
                  n=(meta.get("name") or meta.get("property") or "").lower()
                  c=meta.get("content")
                  if c and "pdf" in n: out.append(urljoin(resp.url,c))
              # anchors
              for a in soup.find_all("a",href=True):
                  href=urljoin(resp.url,a["href"])
                  txt=" ".join(a.stripped_strings).lower()
                  h=href.lower()
                  if ".pdf" in h or "/pdf/" in h or "pdfft" in h or "pdfdirect" in h or ("download" in txt and "pdf" in txt):
                      out.append(href)
              # science direct open manuscript JS/json can contain download URL
              for m in re.findall(r'https?://[^"\']+(?:\.pdf|pdfft[^"\']*)',resp.text):
                  out.append(m.replace("\\u002F","/").replace("\\/","/"))
              seen=set(); ans=[]
              for x in out:
                  if x not in seen:
                      seen.add(x); ans.append(x)
              return ans[:80]

          manifest=[]
          for id,urls in URLS.items():
              print("TRY",id,flush=True)
              result=None; errs=[]
              for u in urls:
                  resp=get(u)
                  if not resp:
                      errs.append("request error "+u); continue
                  ct=(resp.headers.get("content-type") or "").lower()
                  if resp.status_code==200 and valid_pdf(resp.content):
                      result=save(id,resp.content,resp.url); break
                  errs.append(f"{resp.status_code} {ct} {resp.url}")
                  if resp.status_code==200 and "html" in ct:
                      for pu in html_pdf_links(resp):
                          pr=get(pu)
                          if pr and pr.status_code==200 and valid_pdf(pr.content):
                              result=save(id,pr.content,pr.url); break
                      if result: break
              if result:
                  manifest.append(result); print("  DOWNLOADED",result["pages"],result["url"],flush=True)
              else:
                  manifest.append({"id":id,"status":"NOT_RETRIEVED","errors":" | ".join(errs[-10:])[:4000]})
                  print("  MISS",flush=True)
              time.sleep(.2)

          (OUT/"manifest.json").write_text(json.dumps(manifest,indent=2),encoding="utf-8")
          import csv
          fields=["id","status","file","pages","bytes","sha256","url","version_kind","errors"]
          with open(OUT/"manifest.csv","w",newline="",encoding="utf-8") as f:
              w=csv.DictWriter(f,fieldnames=fields,extrasaction="ignore"); w.writeheader(); w.writerows(manifest)
          print("COUNT",sum(x["status"]=="DOWNLOADED" for x in manifest),"of",len(manifest))
          PY
          python /tmp/second.py
      - name: Bundle
        run: |
          cd second_pass
          zip -9 -r ../second_pass.zip .
      - uses: actions/upload-artifact@v4
        with:
          name: LCA-Corpus-Second-Pass
          path: second_pass.zip
          retention-days: 7
