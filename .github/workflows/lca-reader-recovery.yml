name: Archive open LCA PDFs through reader
on:
  push:
    paths:
      - '.github/workflows/lca-reader-recovery.yml'
jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet requests
      - name: Fetch
        run: |
          python - <<'PY'
          import requests,json
          from pathlib import Path
          out=Path("out");out.mkdir(exist_ok=True)
          items={
          "W07":("https://www.researchgate.net/publication/305801682_Climate_change_mitigation_potential_of_local_use_of_harvest_residues_for_bioenergy_in_Canada/fulltext/581bd9da08ae40da2ca923ff/Climate-change-mitigation-potential-of-local-use-of-harvest-residues-for-bioenergy-in-Canada.pdf","Climate change mitigation potential of local use of harvest residues for bioenergy in Canada","10.1111/gcbb.12387"),
          "W41":("https://www.researchgate.net/profile/Bingquan-Zhang/publication/377530614_Soil_organic_carbon_change_can_reduce_the_climate_benefits_of_biofuel_produced_from_forest_residues/links/65aad60aee1e1951fbc23d4c/Soil-organic-carbon-change-can-reduce-the-climate-benefits-of-biofuel-produced-from-forest-residues.pdf","Soil organic carbon change can reduce the climate benefits of biofuel produced from forest residues","10.1016/j.joule.2023.12.018"),
          "W45":("https://www.researchgate.net/publication/276074355_Forest_Biomass_Energy_Assessing_Atmospheric_Carbon_Impacts_by_Discounting_Future_Carbon_Flows/fulltext/5812f46408ae29942f3e9944/Forest-Biomass-Energy-Assessing-Atmospheric-Carbon-Impacts-by-Discounting-Future-Carbon-Flows.pdf","Forest Biomass Energy: Assessing Atmospheric Carbon Impacts by Discounting Future Carbon Flows","10.1111/gcbb.12276"),
          "W52":("https://www.researchgate.net/publication/391804775_Assessing_GHG_Emissions_Implications_of_Forest_Residue_Use_for_Energy_Production/links/68276f2bdf0e3f544f54e4fe/Assessing-GHG-Emissions-Implications-of-Forest-Residue-Use-for-Energy-Production.pdf","Assessing GHG Emissions Implications of Forest Residue Use for Energy Production","10.1111/gcbb.70045"),
          }
          s=requests.Session();s.headers.update({"User-Agent":"Mozilla/5.0"})
          rows=[]
          for id,(src,title,doi) in items.items():
            u="https://r.jina.ai/"+src
            try:
              r=s.get(u,timeout=180)
              body=r.text
              needle=title.lower()[:40]
              ok=r.status_code==200 and len(body)>15000 and needle in body.lower()
              print(id,r.status_code,len(body),body[:80].replace("\n"," "),ok,flush=True)
              if not ok:
                rows.append({"id":id,"status":"FAILED","bytes":len(body),"sample":body[:300]});continue
              header="\n".join([
                "# "+title,"",
                "**Corpus ID:** "+id+"  ",
                "**DOI:** https://doi.org/"+doi+"  ",
                "**Source PDF:** "+src+"  ",
                "**License:** CC BY 4.0  ",
                "**Archive note:** Complete searchable archival rendering of the open-license author/publisher full text. Not the publisher-layout PDF.","","---",""
              ])
              p=out/(id+"_fulltext_CC-BY.md");p.write_text(header+body,encoding="utf-8")
              rows.append({"id":id,"status":"RECOVERED_FULLTEXT","file":p.name,"bytes":p.stat().st_size})
            except Exception as e:
              rows.append({"id":id,"status":"FAILED","error":repr(e)})
          (out/"manifest.json").write_text(json.dumps(rows,indent=2),encoding="utf-8")
          print(json.dumps(rows,indent=2))
          PY
      - run: zip -9 -r reader_recovery.zip out
      - uses: actions/upload-artifact@v4
        with:
          name: LCA-Reader-Recovery
          path: reader_recovery.zip
          retention-days: 7
