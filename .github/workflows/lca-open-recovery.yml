name: Recover blocked open LCA full text

on:
  push:
    paths:
      - '.github/workflows/lca-open-recovery.yml'

jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install validator
        run: python -m pip install --quiet pypdf

      - name: Recover with headless Chrome
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser)"
          echo "Chrome: $CHROME"
          "$CHROME" --version

          render() {
            id="$1"; url="$2"
            echo "RENDER $id $url"
            timeout 180 "$CHROME"               --headless=new --no-sandbox --disable-dev-shm-usage --disable-gpu               --run-all-compositor-stages-before-draw               --virtual-time-budget=20000               --print-to-pdf="out/$id.pdf"               "$url" || true
          }

          # Public/open full-text sources.
          render W07  'https://onlinelibrary.wiley.com/doi/full/10.1111/gcbb.12387'
          render W20  'https://pmc.ncbi.nlm.nih.gov/articles/PMC6145497/'
          render W39  'https://onlinelibrary.wiley.com/doi/full/10.1111/gcbb.13048'
          render W41  'https://www.sciencedirect.com/science/article/pii/S2542435123005378'
          render W43  'https://pmc.ncbi.nlm.nih.gov/articles/PMC7065381/'
          render W45  'https://onlinelibrary.wiley.com/doi/full/10.1111/gcbb.12276'
          render W52  'https://onlinelibrary.wiley.com/doi/full/10.1111/gcbb.70045'

          # Public working-paper / open-manuscript routes.
          render W18  'https://ageconsearch.umn.edu/record/150293/files/Baker%20et%20al_AAEA%202013_A%20multi-sector%20intertemporal%20optimization%20approach%20to%20assess%20the%20GHG%20implications%20of%20U.S.%20forest%20and%20agricultural%20biomass%20electricity%20expansion.pdf'
          render W31  'https://www.sciencedirect.com/science/article/am/pii/S0959652617304614'

          python - <<'PY'
          import json,re
          from pathlib import Path
          from pypdf import PdfReader

          expected={
            "W07":["climate change mitigation potential","harvest residues"],
            "W18":["multi-sector intertemporal optimization","biomass electricity"],
            "W20":["cumulative global forest carbon implications","bioenergy expansion"],
            "W31":["life cycle assessment of co-firing","wood pellets"],
            "W39":["diverting residual biomass","biogenic"],
            "W41":["soil organic carbon change","forest residues"],
            "W43":["potential complementarity","biomass energy expansion"],
            "W45":["forest biomass energy","discounting future carbon flows"],
            "W52":["assessing ghg emissions implications","forest residue"],
          }
          manifest=[]
          for id,terms in expected.items():
            p=Path("out")/(id+".pdf")
            if not p.exists() or p.stat().st_size<5000:
              manifest.append({"id":id,"status":"FAILED","reason":"missing or too small"})
              p.unlink(missing_ok=True)
              continue
            try:
              r=PdfReader(str(p),strict=False)
              pages=len(r.pages)
              text="\n".join((pg.extract_text() or "") for pg in r.pages[:8]).lower()
              good=all(t in text for t in terms)
              # Reject challenge, cookie-wall, or publisher shell pages that do not contain article title.
              if not good:
                manifest.append({"id":id,"status":"FAILED_VALIDATION","pages":pages,
                                 "reason":"expected title terms not found",
                                 "sample":re.sub(r'\s+',' ',text[:500])})
                p.unlink(missing_ok=True)
              else:
                manifest.append({"id":id,"status":"DOWNLOADED","pages":pages,"bytes":p.stat().st_size,
                                 "method":"browser-rendered public/open full text"})
            except Exception as e:
              manifest.append({"id":id,"status":"FAILED_VALIDATION","reason":str(e)})
              p.unlink(missing_ok=True)

          Path("out/manifest.json").write_text(json.dumps(manifest,indent=2),encoding="utf-8")
          import csv
          with open("out/manifest.csv","w",newline="",encoding="utf-8") as f:
            w=csv.DictWriter(f,fieldnames=["id","status","pages","bytes","method","reason","sample"],extrasaction="ignore")
            w.writeheader(); w.writerows(manifest)
          print(json.dumps(manifest,indent=2))
          PY

      - name: Package
        run: zip -9 -r lca_open_recovery.zip out

      - uses: actions/upload-artifact@v4
        with:
          name: LCA-Open-Recovery
          path: lca_open_recovery.zip
          retention-days: 7
