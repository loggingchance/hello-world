name: Build Treasury LCA regulation packet

on:
  push:
    paths:
      - '.github/workflows/treasury-lca-packet.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PDF tools
        run: python -m pip install --quiet pypdf reportlab

      - name: Download authoritative Federal Register PDFs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p source out
          getpdf () {
            local url="$1"
            local out="$2"
            echo "Downloading $url"
            curl -L --fail --retry 5 --retry-delay 2 --connect-timeout 30 --max-time 300 \
              -A "Mozilla/5.0" -o "$out" "$url"
            test "$(stat -c%s "$out")" -gt 5000
            head -c 4 "$out" | grep -q '%PDF'
          }
          getpdf "https://www.govinfo.gov/content/pkg/FR-2025-01-15/pdf/2025-00196.pdf" "source/final_td10024.pdf"
          getpdf "https://www.govinfo.gov/content/pkg/FR-2024-06-03/pdf/2024-11719.pdf" "source/proposed_reg11928323.pdf"
          getpdf "https://www.govinfo.gov/content/pkg/FR-2024-07-18/pdf/2024-15718.pdf" "source/proposed_correction.pdf"

      - name: Verify source documents
        shell: bash
        run: |
          python - <<'PY'
          from pypdf import PdfReader
          expected = {
              "source/final_td10024.pdf": 122,
              "source/proposed_reg11928323.pdf": 55,
              "source/proposed_correction.pdf": 1,
          }
          for path, pages in expected.items():
              r = PdfReader(path, strict=False)
              print(path, len(r.pages))
              assert len(r.pages) == pages, (path, len(r.pages), pages)
          PY

      - name: Build cover, contents, and merged searchable packet
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from reportlab.lib.pagesizes import letter
          from reportlab.lib.styles import getSampleStyleSheet, ParagraphStyle
          from reportlab.lib.enums import TA_CENTER, TA_LEFT
          from reportlab.lib import colors
          from reportlab.platypus import SimpleDocTemplate, Paragraph, Spacer, Table, TableStyle, PageBreak
          from reportlab.lib.units import inch
          from pypdf import PdfReader, PdfWriter

          cover = Path("out/reader_guide.pdf")
          styles = getSampleStyleSheet()
          styles.add(ParagraphStyle(name="Title2", parent=styles["Title"], fontName="Helvetica-Bold",
                                    fontSize=18, leading=22, alignment=TA_CENTER, textColor=colors.HexColor("#173F2A"),
                                    spaceAfter=14))
          styles.add(ParagraphStyle(name="Sub", parent=styles["Normal"], fontName="Helvetica",
                                    fontSize=11, leading=15, alignment=TA_CENTER, textColor=colors.HexColor("#4A4A4A"),
                                    spaceAfter=10))
          styles.add(ParagraphStyle(name="H2x", parent=styles["Heading2"], fontName="Helvetica-Bold",
                                    fontSize=13, leading=16, textColor=colors.HexColor("#173F2A"), spaceBefore=8, spaceAfter=7))
          styles.add(ParagraphStyle(name="Bodyx", parent=styles["BodyText"], fontName="Helvetica",
                                    fontSize=10.5, leading=14, alignment=TA_LEFT, spaceAfter=7))
          styles.add(ParagraphStyle(name="Smallx", parent=styles["BodyText"], fontName="Helvetica",
                                    fontSize=9, leading=12, textColor=colors.HexColor("#555555"), spaceAfter=5))

          doc = SimpleDocTemplate(str(cover), pagesize=letter,
                                  rightMargin=0.75*inch, leftMargin=0.75*inch,
                                  topMargin=0.7*inch, bottomMargin=0.7*inch)
          story = []
          story.append(Spacer(1, 0.4*inch))
          story.append(Paragraph("U.S. Treasury / IRS Regulatory Record", styles["Title2"]))
          story.append(Paragraph("Lifecycle Greenhouse Gas Emissions for Clean Electricity Credits<br/>IRC Sections 45Y and 48E - Wood Biomass / Combustion & Gasification Focus", styles["Sub"]))
          story.append(Spacer(1, 0.15*inch))
          story.append(Paragraph("Compiled October 2, 2026", styles["Sub"]))
          story.append(Spacer(1, 0.25*inch))
          story.append(Paragraph("Scope", styles["H2x"]))
          story.append(Paragraph(
              "This packet compiles the Treasury Department / Internal Revenue Service rulemaking documents that establish the lifecycle greenhouse-gas emissions framework relevant to combustion and gasification facilities seeking the Clean Electricity Production Credit under section 45Y or the Clean Electricity Investment Credit under section 48E. The entire final rule is included because qualification, facility definitions, CHP treatment, provisional emissions rates, substantiation, and section 48E cross-references interact with the LCA rules.", styles["Bodyx"]))
          story.append(Paragraph(
              "The controlling rule is T.D. 10024, effective January 15, 2025. The complete proposed rule and its correction are included as rulemaking history because the final rule expressly incorporates the proposed rule's Background and Explanation of Provisions to the extent consistent with the final rule.", styles["Bodyx"]))
          story.append(Paragraph(
              "Not included: the statutory text of IRC sections 45Y and 48E; non-regulatory IRS notices, forms, instructions, annual emissions tables, or DOE emissions-value-request materials; and unrelated prevailing-wage, apprenticeship, domestic-content, or energy-community guidance.", styles["Smallx"]))
          story.append(PageBreak())

          story.append(Paragraph("Contents and Key LCA Locations", styles["H2x"]))
          data = [
              ["Packet page", "Document / key location"],
              ["3", "Final Regulations - T.D. 10024, 90 FR 4006-4127 (Jan. 15, 2025) - controlling rule"],
              ["43", "Final-rule preamble: VIII. Greenhouse Gas Emissions Rates for Qualified Facilities (FR 4046)"],
              ["51", "Final-rule preamble: LCA Requirements (FR 4054)"],
              ["53-67", "Final-rule preamble: biomass / woody biomass, feedstock categorization, market effects, models, substantiation"],
              ["102", "Final regulatory text: 26 CFR 1.45Y-5 - greenhouse-gas emissions / LCA rules (FR 4105)"],
              ["122", "Final regulatory text: 26 CFR 1.48E-5 - 48E emissions rules / PER / substantiation (FR 4125)"],
              ["125", "Proposed Regulations - REG-119283-23, 89 FR 47792-47846 (June 3, 2024)"],
              ["136-137", "Proposed-rule preamble: C&G LCA framework and additional LCA issues"],
              ["152-153", "Proposed-rule preamble: 48E greenhouse-gas emissions / PER process"],
              ["164", "Proposed regulatory text: proposed 1.45Y-5"],
              ["178", "Proposed regulatory text: proposed 1.48E-5"],
              ["180", "Correction to proposed rule - 89 FR 58305 (July 18, 2024)"],
          ]
          table = Table(data, colWidths=[0.95*inch, 5.7*inch], repeatRows=1)
          table.setStyle(TableStyle([
              ("BACKGROUND",(0,0),(-1,0),colors.HexColor("#173F2A")),
              ("TEXTCOLOR",(0,0),(-1,0),colors.white),
              ("FONTNAME",(0,0),(-1,0),"Helvetica-Bold"),
              ("FONTNAME",(0,1),(-1,-1),"Helvetica"),
              ("FONTSIZE",(0,0),(-1,-1),9),
              ("LEADING",(0,0),(-1,-1),11),
              ("GRID",(0,0),(-1,-1),0.35,colors.HexColor("#B7B7B7")),
              ("VALIGN",(0,0),(-1,-1),"TOP"),
              ("LEFTPADDING",(0,0),(-1,-1),5),
              ("RIGHTPADDING",(0,0),(-1,-1),5),
              ("TOPPADDING",(0,0),(-1,-1),5),
              ("BOTTOMPADDING",(0,0),(-1,-1),5),
          ]))
          story.append(table)
          story.append(Spacer(1, 0.2*inch))
          story.append(Paragraph("Regulatory status check", styles["H2x"]))
          story.append(Paragraph(
              "As of October 2, 2026, the current 26 CFR sections 1.45Y-5 and 1.48E-5 remain sourced to T.D. 10024. No later Treasury amendment or correction to these LCA/emissions-rate sections was identified in the Federal Register search used to compile this packet.", styles["Bodyx"]))
          story.append(Paragraph(
              "For wood-biomass projects, the most operationally important provisions are the consequential LCA requirements in 1.45Y-5(d), including feedstock-generation boundaries, future anticipated baselines, direct and significant indirect emissions, market-mediated effects, a 30-year analytical time horizon, feedstock categorization, and substantiation of biomass origin. Section 1.48E-5 applies the 45Y emissions methodology to 48E and adds the anticipated-emissions and recapture framework.", styles["Bodyx"]))
          doc.build(story)

          final_path = Path("source/final_td10024.pdf")
          proposed_path = Path("source/proposed_reg11928323.pdf")
          corr_path = Path("source/proposed_correction.pdf")
          pieces = [cover, final_path, proposed_path, corr_path]

          writer = PdfWriter()
          offsets = {}
          cursor = 0
          for p in pieces:
              offsets[p.name] = cursor
              r = PdfReader(str(p), strict=False)
              for page in r.pages:
                  writer.add_page(page)
              cursor += len(r.pages)

          # Top-level bookmarks
          writer.add_outline_item("Reader's Guide and Contents", 0)
          final_start = offsets[final_path.name]
          prop_start = offsets[proposed_path.name]
          corr_start = offsets[corr_path.name]
          final_bm = writer.add_outline_item("Final Regulations - T.D. 10024 (90 FR 4006)", final_start)
          writer.add_outline_item("VIII. Greenhouse Gas Emissions Rates - preamble", final_start + 40, parent=final_bm)
          writer.add_outline_item("LCA Requirements - preamble", final_start + 48, parent=final_bm)
          writer.add_outline_item("Woody biomass / feedstock / market-effects discussion", final_start + 50, parent=final_bm)
          writer.add_outline_item("26 CFR 1.45Y-5 - final regulatory text", final_start + 99, parent=final_bm)
          writer.add_outline_item("26 CFR 1.48E-5 - final regulatory text", final_start + 119, parent=final_bm)

          prop_bm = writer.add_outline_item("Proposed Regulations - REG-119283-23 (89 FR 47792)", prop_start)
          writer.add_outline_item("C&G Facility LCA framework - proposed preamble", prop_start + 11, parent=prop_bm)
          writer.add_outline_item("Additional C&G LCA issues - proposed preamble", prop_start + 12, parent=prop_bm)
          writer.add_outline_item("48E emissions / PER - proposed preamble", prop_start + 27, parent=prop_bm)
          writer.add_outline_item("Proposed 1.45Y-5 regulatory text", prop_start + 39, parent=prop_bm)
          writer.add_outline_item("Proposed 1.48E-5 regulatory text", prop_start + 53, parent=prop_bm)
          writer.add_outline_item("Correction to Proposed Regulations (89 FR 58305)", corr_start)

          writer.add_metadata({
              "/Title": "Treasury-IRS LCA Regulations for IRC Sections 45Y and 48E",
              "/Subject": "Lifecycle greenhouse gas emissions, biomass feedstocks, combustion/gasification facilities, PER and substantiation",
              "/Author": "Compilation of U.S. Department of the Treasury / Internal Revenue Service Federal Register materials",
              "/Keywords": "45Y 48E lifecycle analysis LCA woody biomass feedstock combustion gasification Treasury IRS"
          })

          out = Path("out/Treasury_45Y_48E_LCA_Regulations_Compiled.pdf")
          with out.open("wb") as f:
              writer.write(f)

          # Verification manifest
          check = PdfReader(str(out), strict=False)
          assert len(check.pages) == 180, len(check.pages)
          with open("out/manifest.txt","w") as f:
              f.write(f"TOTAL PAGES: {len(check.pages)}\n")
              f.write("Source 1: GovInfo 2025-00196.pdf - T.D. 10024 - 122 pages\n")
              f.write("Source 2: GovInfo 2024-11719.pdf - REG-119283-23 - 55 pages\n")
              f.write("Source 3: GovInfo 2024-15718.pdf - correction - 1 page\n")
              f.write("Reader guide: 2 pages\n")
          print("TOTAL", len(check.pages))
          PY

      - name: Render-check selected pages
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils >/dev/null
          mkdir -p out/check
          pdfinfo out/Treasury_45Y_48E_LCA_Regulations_Compiled.pdf | head -20
          for p in 1 2 3 43 51 102 122 125 180; do
            pdftoppm -f "$p" -singlefile -png -r 90 out/Treasury_45Y_48E_LCA_Regulations_Compiled.pdf "out/check/page_$p" >/dev/null 2>&1
            test -s "out/check/page_$p.png"
          done

      - name: Upload packet
        uses: actions/upload-artifact@v4
        with:
          name: Treasury-45Y-48E-LCA-Regulations
          path: |
            out/Treasury_45Y_48E_LCA_Regulations_Compiled.pdf
            out/manifest.txt
          if-no-files-found: error
          retention-days: 7
